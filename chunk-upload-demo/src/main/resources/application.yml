server:
  port: 8090

spring:
  application:
    name: chunk-upload-demo
  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 40MB

chunk-upload:
  # 分片与最终文件的落地目录
  storage-dir: E:/chunk-upload-demo

# mica-ppocr 本地 OCR（模型放在 src/main/resources/models/ 下，classpath 前缀加载，任意目录启动均可）
# 身份证/营业执照等结构化识别见 OcrController，模型说明：https://gitee.com/dreamlu/mica-ppocr
mica:
  ai:
    ppocr:
      det-model-path: classpath:models/ppocr-v6/small/det.onnx       # 检测模型
      rec-model-path: classpath:models/ppocr-v6/small/rec.onnx       # 识别模型
      rec-char-dict-path: classpath:models/ppocr-v6/small/dict.txt   # 识别字符字典

# 阿里云 OSS（留空则 OSS 上传接口不可用；凭据建议用环境变量注入，不要写进 git）
# bucket 同时兼容 OSS_BUCKET 和 permission-system 那套 OSS_BUCKET_NAME 两种变量名
oss:
  endpoint: ${OSS_ENDPOINT:}
  accessKeyId: ${OSS_ACCESS_KEY_ID:}
  accessKeySecret: ${OSS_ACCESS_KEY_SECRET:}
  bucketName: ${OSS_BUCKET:${OSS_BUCKET_NAME:}}
  urlPrefix: ${OSS_URL_PREFIX:}
