server:
  port: 8090

spring:
  application:
    name: chunk-upload-demo
  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 40MB

chunk-upload:
  # 分片与最终文件的落地目录
  storage-dir: E:/chunk-upload-demo

# 阿里云 OSS（留空则 OSS 上传接口不可用；凭据建议用环境变量注入，不要写进 git）
# bucket 同时兼容 OSS_BUCKET 和 permission-system 那套 OSS_BUCKET_NAME 两种变量名
oss:
  endpoint: ${OSS_ENDPOINT:}
  accessKeyId: ${OSS_ACCESS_KEY_ID:}
  accessKeySecret: ${OSS_ACCESS_KEY_SECRET:}
  bucketName: ${OSS_BUCKET:${OSS_BUCKET_NAME:}}
  urlPrefix: ${OSS_URL_PREFIX:}
