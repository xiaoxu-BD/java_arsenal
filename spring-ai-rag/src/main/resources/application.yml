  ai:
    dashscope:
      api-key: @dashscope.api.key@
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 768
    vectorstore:
      pgvector:
        # 向量索引类型
        index-type: HNSW
        # 距离度量，余弦值
        distance-type: COSINE_DISTANCE
        # 向量维度
        dimensions: 768
        # 批量处理大小
        max-document-batch-size: 9
        # 启动时是否自动创建表（设为false，避免启动时连接失败）
        initialize-schema: false
        # 创建的表名
        table-name: vector_st
  datasource:
    url: jdbc:postgresql://124.222.192.3:5433/rag_test # 记得改成你自己的
    username: pgvector # 记得改成你自己的
    password: pgvector # 记得改成你自己的
  elasticsearch:
