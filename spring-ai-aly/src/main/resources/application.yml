# application.yml

server:
  port: 8000

spring:
  ai:
    dashscope:
      # 与 StreamController 中手写 HTTP 调用使用的是同一个 key，供 starter 自动装配 ChatModel
      api-key: sk-6f85434255b44f4bad26ee2700d6b47f
      chat:
        options:
          # 实测该账号下调 deepseek-r1 / deepseek-v3 均返回 "Model not exist"，
          # qwen-plus 在原生 API（starter 走的路径）与兼容模式下都可用
          model: qwen-plus

