dubbo:
  consumer:
    timeout: 3000
    check: false
  protocol:
    name: dubbo
    port: -1
  registry:
    address: nacos://192.168.200.128:8848
    parameters:
      namespace: only_s
      group: bySelf
  application:
    name: ${spring.application.name}
    qos-enable: true
    qos-accept-foreign-ip: false