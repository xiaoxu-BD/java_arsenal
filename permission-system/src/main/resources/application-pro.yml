spring:
  datasource:
    username: ${DB_USERNAME:root}
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:2026mysql_ds}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:6}

  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

server:
  port: ${SERVER_PORT:13690}

xxl:
  job:
    admin:
      address: ${XXL_JOB_ADMIN_ADDRESS:http://127.0.0.1:8082/xxl-job-admin}
    executor:
      appName: ${XXL_JOB_APP_NAME:permission-job-executor}
      port: ${XXL_JOB_EXECUTOR_PORT:9998}
      logPath: /data/applogs/xxl-job/jobhandler
      logRetentionDays: 30
    accessToken: ${XXL_JOB_ACCESS_TOKEN:default_token}

# 阿里云 OSS
oss:
  endpoint: ${OSS_ENDPOINT:oss-cn-shanghai.aliyuncs.com}
  accessKeyId: ${OSS_ACCESS_KEY_ID:}
  accessKeySecret: ${OSS_ACCESS_KEY_SECRET:}
  bucketName: ${OSS_BUCKET_NAME:}
  urlPrefix: ${OSS_URL_PREFIX:}

# 本地日志写到项目下，方便查看
logging:
  file:
    path: ./logs/permission-service