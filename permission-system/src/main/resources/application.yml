spring:
  application:
    name: permission-service

  profiles:
    # 默认激活 prod，本地调试用 -Dspring.profiles.active=dev 或 IDE 里指定
    active: ${SPRING_PROFILES_ACTIVE:pro}

  datasource:
    # 生产：环境变量注入；开发：application-dev.yml 直接写死
    username: ${DB_USERNAME:root}
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:2026mysql_ds}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:6}
server:
  port: ${SERVER_PORT:13690}
