spring:
  application:
    name: permission-service

  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  profiles:
    # 默认激活 local（本地开发），生产部署通过环境变量 SPRING_PROFILES_ACTIVE=pro 覆盖
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    # 生产：环境变量注入；开发：application-dev.yml 直接写死
    username: ${DB_USERNAME:root}
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:2026mysql_ds}?serverTimezone=Asia/Shanghai&characterEncoding=utf-8
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:6}

  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

xxl:
  job:
    admin:
      address: ${XXL_JOB_ADMIN_ADDRESS:http://127.0.0.1:8080/xxl-job-admin}
    executor:
      app-name: ${XXL_JOB_APP_NAME:permission-job-executor}
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      port: ${XXL_JOB_EXECUTOR_PORT:9998}
      log-path: /data/applogs/xxl-job/jobhandler
      log-retention-days: 30
    access-token: ${XXL_JOB_ACCESS_TOKEN:default_token}

server:
  port: ${SERVER_PORT:13690}

