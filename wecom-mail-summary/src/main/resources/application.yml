wecom:
  # 接入节点一:群列表(配置 roomId 时下拉数据源)
  # url 为空 → 使用后端写死的 Mock 群列表(WechatRoomClient.builtinMockRooms,联调开箱即用)
  # url 配置 → 调其他开发组 HTTP 接口;两种模式都会同步落库 t_e_wechat_room
  room-list-api:
    url: ""                 # 例: http://other-team/api/rooms
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    cache-ttl-minutes: 5
  mail:
    send:
      schedule-cron: "0 * * * * *"      # 每分钟扫描(到点判断/补发/重试/超时兜底)
      sending-timeout-minutes: 10       # SENDING 卡死判定阈值
      retry-max-count: 3                # 失败自动重试上限
      retry-backoff-minutes: 5,15,30    # 各次重试的退避间隔(分钟)
      late-resend-delay-minutes: 10     # 迟到消息补充轮延迟(当日已发过SUCCESS后又来新消息,超过该间隔发补充轮;0=来了就发)

# 真实 SMTP 已配置(163 邮箱);发送失败的失败原因会记录在发送记录中



---
# 本地零依赖开发模式(文件版 H2,重启数据不丢): --spring.profiles.active=h2dev
spring:
  config:
    activate:
      on-profile: h2dev
  datasource:
    url: jdbc:h2:file:./data/wecommail;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console
