<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业微信群消息汇总系统 - 微信群配置</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-light: #eff6ff;
    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --danger-light: #fef2f2;
    --text-main: #1e293b;
    --text-sub: #64748b;
    --text-light: #94a3b8;
    --border: #e2e8f0;
    --border-light: #eef2f7;
    --bg: #f4f6fa;
    --card: #ffffff;
    --sidebar-bg: #1c2733;
    --sidebar-active: #2563eb;
    --success: #16a34a;
    --success-light: #f0fdf4;
    --warning: #d97706;
    --warning-light: #fffbeb;
    --info-light: #eff6ff;
    --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text-main);
    font-size: 14px;
    min-height: 100vh;
  }

  /* ===================== 布局 ===================== */
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 224px; background: var(--sidebar-bg); color: #cbd5e1;
    display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 10;
  }
  .sidebar-logo {
    height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 20px;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .sidebar-logo .logo-icon {
    width: 32px; height: 32px; border-radius: 8px; background: var(--primary);
    display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0;
  }
  .sidebar-logo .logo-text { font-size: 14px; font-weight: 600; color: #f1f5f9; line-height: 1.3; }
  .sidebar-menu { padding: 16px 12px; flex: 1; }
  .menu-item {
    display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 8px;
    cursor: pointer; color: #cbd5e1; font-size: 14px; transition: all .15s; margin-bottom: 4px;
  }
  .menu-item:hover { background: rgba(255,255,255,.07); color: #fff; }
  .menu-item.active { background: var(--sidebar-active); color: #fff; font-weight: 500; }
  .sidebar-footer { padding: 16px 20px; font-size: 12px; color: #64748b; border-top: 1px solid rgba(255,255,255,.08); }

  .main { flex: 1; margin-left: 224px; display: flex; flex-direction: column; }
  .page-header {
    height: 60px; background: var(--card); border-bottom: 1px solid var(--border-light);
    display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    position: sticky; top: 0; z-index: 5;
  }
  .page-header h1 { font-size: 17px; font-weight: 600; }
  .page-header .header-sub { font-size: 12px; color: var(--text-light); }
  .page-content { padding: 24px; }

  /* ===================== 卡片 & 工具条 ===================== */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: 0 1px 3px rgba(15,23,42,.05); }
  .card-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border-light);
  }
  .card-toolbar .toolbar-title { font-size: 15px; font-weight: 600; }
  .card-toolbar .toolbar-title .count-tag {
    font-size: 12px; color: var(--primary); background: var(--primary-light);
    border-radius: 10px; padding: 1px 8px; margin-left: 8px; font-weight: 400;
  }
  .toolbar-btns { display: flex; gap: 10px; }

  /* ===================== 按钮 ===================== */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent;
    border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer;
    transition: all .15s; line-height: 1; user-select: none; white-space: nowrap;
  }
  .btn svg { flex-shrink: 0; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-outline { background: #fff; border-color: var(--border); color: var(--text-main); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: var(--danger-hover); }
  .btn-text { background: none; border: none; padding: 2px 4px; font-size: 13px; color: var(--primary); cursor: pointer; }
  .btn-text:hover { text-decoration: underline; }
  .btn-text.danger { color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ===================== 表格 ===================== */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 13px 20px; font-size: 13px; vertical-align: top; }
  thead th {
    background: #f8fafc; color: var(--text-sub); font-weight: 500;
    border-bottom: 1px solid var(--border-light); white-space: nowrap;
  }
  tbody td { border-bottom: 1px solid var(--border-light); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #f8fafd; }
  .cell-roomid { font-family: Consolas, Monaco, monospace; font-size: 12px; color: var(--text-sub); }
  .cell-actions { white-space: nowrap; }
  .cell-actions .btn-text + .btn-text { margin-left: 10px; }
  .email-tags { display: flex; flex-wrap: wrap; gap: 4px; max-width: 320px; }
  .email-tag { font-size: 12px; padding: 2px 8px; border-radius: 4px; display: inline-flex; align-items: center; gap: 4px; }
  .email-tag.to { background: var(--info-light); color: var(--primary); }
  .email-tag.cc { background: #f8fafc; color: var(--text-sub); border: 1px solid var(--border-light); }
  .email-empty { color: var(--text-light); font-size: 12px; }

  /* ===================== Badge ===================== */
  .badge {
    display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 500; line-height: 1.6;
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; }
  .badge-success { background: var(--success-light); color: var(--success); }
  .badge-success::before { background: var(--success); }
  .badge-fail { background: var(--danger-light); color: var(--danger); }
  .badge-fail::before { background: var(--danger); }
  .badge-waiting { background: var(--warning-light); color: var(--warning); }
  .badge-waiting::before { background: var(--warning); }
  .badge-sending { background: var(--info-light); color: var(--primary); }
  .badge-sending::before { background: var(--primary); }

  .fail-reason { font-size: 12px; color: var(--danger); margin-top: 4px; max-width: 220px; }

  /* ===================== Modal ===================== */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 100;
    display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 60px 16px;
  }
  .modal-mask.open { display: flex; }
  .modal {
    background: #fff; border-radius: 10px; width: 520px; max-width: 100%;
    box-shadow: 0 20px 50px rgba(15,23,42,.25); animation: modalIn .18s ease;
  }
  .modal.wide { width: 720px; }
  @keyframes modalIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border-light); }
  .modal-header h3 { font-size: 15px; font-weight: 600; }
  .modal-close {
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    border: none; background: none; color: var(--text-light); cursor: pointer; border-radius: 6px; font-size: 18px;
  }
  .modal-close:hover { background: #f1f5f9; color: var(--text-main); }
  .modal-body { padding: 20px; max-height: 62vh; overflow-y: auto; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border-light); }

  /* ===================== 表单 ===================== */
  .form-item { margin-bottom: 18px; }
  .form-item:last-child { margin-bottom: 0; }
  .form-label { display: block; font-size: 13px; color: var(--text-main); margin-bottom: 7px; font-weight: 500; }
  .form-label .required { color: var(--danger); margin-right: 2px; }
  .form-input, .form-select {
    width: 100%; height: 36px; border: 1px solid var(--border); border-radius: 6px;
    padding: 0 12px; font-size: 13px; color: var(--text-main); background: #fff; outline: none; transition: border .15s;
  }
  .form-input:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
  .form-input:disabled, .form-select:disabled { background: #f8fafc; color: var(--text-sub); cursor: not-allowed; }
  .form-hint { font-size: 12px; color: var(--text-light); margin-top: 6px; }
  .form-error { font-size: 12px; color: var(--danger); margin-top: 6px; display: none; }
  .form-error.show { display: block; }

  .email-section { border: 1px solid var(--border-light); border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #fafbfd; }
  .email-section-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .email-add-row { display: flex; gap: 8px; margin-top: 10px; }
  .email-add-row .form-input { flex: 1; }
  .email-list { display: flex; flex-direction: column; gap: 6px; }
  .email-item {
    display: flex; align-items: center; justify-content: space-between; background: #fff;
    border: 1px solid var(--border-light); border-radius: 6px; padding: 7px 10px; font-size: 13px;
  }
  .email-item .email-val { word-break: break-all; }
  .email-item .tag { font-size: 11px; border-radius: 4px; padding: 1px 6px; margin-right: 8px; }
  .email-item .tag.to { background: var(--info-light); color: var(--primary); }
  .email-item .tag.cc { background: #f1f5f9; color: var(--text-sub); }
  .email-remove {
    border: none; background: none; color: var(--text-light); cursor: pointer; font-size: 15px;
    width: 22px; height: 22px; border-radius: 4px; flex-shrink: 0; margin-left: 10px;
  }
  .email-remove:hover { color: var(--danger); background: var(--danger-light); }
  .email-empty-row { font-size: 12px; color: var(--text-light); padding: 4px 0; }

  .detail-grid { display: grid; grid-template-columns: 90px 1fr; row-gap: 12px; column-gap: 14px; margin-bottom: 20px; }
  .detail-label { color: var(--text-sub); font-size: 13px; text-align: right; }
  .detail-value { font-size: 13px; word-break: break-all; }
  .error-callout {
    background: var(--danger-light); border: 1px solid #fecaca; color: var(--danger);
    border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 20px;
  }
  .section-title { font-size: 14px; font-weight: 600; margin: 4px 0 12px; display: flex; align-items: center; gap: 8px; }
  .section-title::before { content: ""; width: 3px; height: 14px; background: var(--primary); border-radius: 2px; }

  /* ===================== 空状态 / 加载 ===================== */
  .empty-state { text-align: center; padding: 56px 20px; color: var(--text-light); }
  .empty-state svg { margin-bottom: 12px; }
  .empty-state .empty-title { font-size: 14px; color: var(--text-sub); margin-bottom: 4px; }
  .empty-state .empty-desc { font-size: 12px; }
  .loading-row { text-align: center; padding: 40px; color: var(--text-light); font-size: 13px; }

  /* ===================== Toast ===================== */
  .toast-area { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .toast {
    display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 8px;
    padding: 10px 18px; font-size: 13px; box-shadow: 0 8px 24px rgba(15,23,42,.14);
    animation: toastIn .25s ease; border-left: 3px solid var(--primary); max-width: 520px;
  }
  .toast.success { border-left-color: var(--success); }
  .toast.error { border-left-color: var(--danger); }
  .toast.fade-out { opacity: 0; transition: opacity .3s; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }

  .msg-item { display: flex; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--border-light); }
  .msg-item:last-child { border-bottom: none; }
  .msg-avatar {
    width: 34px; height: 34px; border-radius: 50%; background: var(--primary-light); color: var(--primary);
    display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; font-weight: 500;
  }
  .msg-meta { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .msg-from { font-size: 13px; font-weight: 600; }
  .msg-time { font-size: 12px; color: var(--text-light); }
  .msg-content { font-size: 13px; color: var(--text-main); line-height: 1.6; word-break: break-all; }

  .confirm-text { font-size: 14px; line-height: 1.7; }
  .confirm-text .strong { color: var(--danger); font-weight: 600; }
  .tip-bar {
    background: var(--warning-light); border: 1px solid #fde68a; color: #92400e;
    border-radius: 8px; padding: 8px 12px; font-size: 12px; margin-bottom: 16px;
  }
</style>
</head>
<body>
<div class="layout">
  <!-- 左侧导航 -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </div>
      <div class="logo-text">群消息汇总邮件系统</div>
    </div>
    <nav class="sidebar-menu">
      <div class="menu-item active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        微信群配置
      </div>
    </nav>
    <div class="sidebar-footer">Enterprise WeChat Mail · 管理后台</div>
  </aside>

  <!-- 主区域 -->
  <main class="main">
    <div class="page-header">
      <h1>微信群配置</h1>
      <div class="header-sub" id="todayLabel"></div>
    </div>

    <div class="page-content">
      <div class="card">
        <div class="card-toolbar">
          <div class="toolbar-title">群配置列表<span class="count-tag" id="configCount"></span></div>
          <div class="toolbar-btns">
            <button class="btn btn-outline" id="btnRecords">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
              发送记录
            </button>
            <button class="btn btn-primary" id="btnAdd">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              新增群
            </button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:110px">群 ID</th>
                <th style="width:150px">群名称</th>
                <th>邮件配置</th>
                <th style="width:90px">发送时间</th>
                <th style="width:90px">状态</th>
                <th style="width:240px">操作</th>
              </tr>
            </thead>
            <tbody id="configTbody"></tbody>
          </table>
          <div id="configEmpty" class="empty-state" style="display:none">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            <div class="empty-title">暂无群配置</div>
            <div class="empty-desc">点击右上角「新增群」开始配置需要汇总发送邮件的微信群</div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ========== 新增群 Modal ========== -->
<div class="modal-mask" id="groupModalMask">
  <div class="modal">
    <div class="modal-header">
      <h3>新增群</h3>
      <button class="modal-close" data-close="groupModalMask">×</button>
    </div>
    <div class="modal-body">
      <div class="form-item">
        <label class="form-label"><span class="required">*</span>roomId（微信群）</label>
        <select class="form-select" id="groupRoomSelect"><option value="">加载中……</option></select>
        <div class="form-hint" id="groupRoomHint">下拉数据来自后端群列表接口（已过滤配置过的群）</div>
      </div>
      <div class="form-item">
        <label class="form-label"><span class="required">*</span>群名称</label>
        <input class="form-input" id="groupGroupName" type="text" placeholder="请输入群名称（接口只提供 roomId，群名需人工确认）">
        <div class="form-error" id="groupNameError"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close="groupModalMask">取 消</button>
      <button class="btn btn-primary" id="groupSaveBtn">保 存</button>
    </div>
  </div>
</div>

<!-- ========== 修改群 Modal（roomId 只读） ========== -->
<div class="modal-mask" id="editModalMask">
  <div class="modal">
    <div class="modal-header">
      <h3>修改群</h3>
      <button class="modal-close" data-close="editModalMask">×</button>
    </div>
    <div class="modal-body">
      <div class="form-item">
        <label class="form-label">roomId（不允许修改）</label>
        <input class="form-input" id="editRoomId" type="text" disabled>
      </div>
      <div class="form-item">
        <label class="form-label"><span class="required">*</span>群名称</label>
        <input class="form-input" id="editGroupName" type="text" placeholder="请输入群名称">
        <div class="form-error" id="editGroupNameError"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close="editModalMask">取 消</button>
      <button class="btn btn-primary" id="editSaveBtn">保 存</button>
    </div>
  </div>
</div>

<!-- ========== 邮件配置 Modal ========== -->
<div class="modal-mask" id="emailModalMask">
  <div class="modal">
    <div class="modal-header">
      <h3>配置邮件</h3>
      <button class="modal-close" data-close="emailModalMask">×</button>
    </div>
    <div class="modal-body">
      <div class="tip-bar" id="emailModalTip"></div>
      <div class="email-section">
        <div class="email-section-title">
          <span class="badge badge-success" style="background:var(--success-light)">TO</span> 收件人
        </div>
        <div class="email-list" id="toList"></div>
        <div class="email-add-row">
          <input class="form-input" id="toInput" type="text" placeholder="输入邮箱后回车或点击添加">
          <button class="btn btn-outline" id="toAddBtn">添加</button>
        </div>
        <div class="form-error" id="toInputError"></div>
      </div>
      <div class="email-section">
        <div class="email-section-title">
          <span class="badge badge-sending" style="background:#f1f5f9;color:var(--text-sub)">CC</span> 抄送人
        </div>
        <div class="email-list" id="ccList"></div>
        <div class="email-add-row">
          <input class="form-input" id="ccInput" type="text" placeholder="输入邮箱后回车或点击添加">
          <button class="btn btn-outline" id="ccAddBtn">添加</button>
        </div>
        <div class="form-error" id="ccInputError"></div>
      </div>
      <div class="form-item">
        <label class="form-label"><span class="required">*</span>每日固定发送时间</label>
        <input class="form-input" id="sendTimeInput" type="time" style="width:160px">
        <div class="form-hint">每天到达该时间后，系统将当天该群未成功发送的消息汇总为一封邮件发出（邮件模板固定）</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close="emailModalMask">取 消</button>
      <button class="btn btn-primary" id="emailSaveBtn">保 存</button>
    </div>
  </div>
</div>

<!-- ========== 今日消息 Modal ========== -->
<div class="modal-mask" id="msgModalMask">
  <div class="modal wide">
    <div class="modal-header">
      <h3 id="msgModalTitle">今日消息</h3>
      <button class="modal-close" data-close="msgModalMask">×</button>
    </div>
    <div class="modal-body" id="msgModalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close="msgModalMask">关 闭</button>
    </div>
  </div>
</div>

<!-- ========== 发送记录 Modal ========== -->
<div class="modal-mask" id="recordsModalMask">
  <div class="modal wide">
    <div class="modal-header">
      <h3>发送记录</h3>
      <button class="modal-close" data-close="recordsModalMask">×</button>
    </div>
    <div class="modal-body">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:160px">发送时间</th>
              <th style="width:130px">群名称</th>
              <th style="width:80px">消息数量</th>
              <th>收件人</th>
              <th style="width:120px">状态</th>
              <th style="width:90px">操作</th>
            </tr>
          </thead>
          <tbody id="recordsTbody"></tbody>
        </table>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close="recordsModalMask">关 闭</button>
    </div>
  </div>
</div>

<!-- ========== 发送详情 Modal ========== -->
<div class="modal-mask" id="detailModalMask">
  <div class="modal wide">
    <div class="modal-header">
      <h3>发送详情</h3>
      <button class="modal-close" data-close="detailModalMask">×</button>
    </div>
    <div class="modal-body" id="detailModalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close="detailModalMask">关 闭</button>
    </div>
  </div>
</div>

<!-- ========== 删除确认 Modal ========== -->
<div class="modal-mask" id="confirmModalMask">
  <div class="modal" style="width:420px">
    <div class="modal-header">
      <h3>删除确认</h3>
      <button class="modal-close" data-close="confirmModalMask">×</button>
    </div>
    <div class="modal-body">
      <div class="confirm-text" id="confirmText"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close="confirmModalMask">取 消</button>
      <button class="btn btn-danger" id="confirmOkBtn">确认删除</button>
    </div>
  </div>
</div>

<div class="toast-area" id="toastArea"></div>

<script>
/* ============================================================
 * API 层:所有数据来自后端(落库),无前端 Mock
 * ============================================================ */
async function api(method, path, body) {
  const opt = { method, headers: { 'Content-Type': 'application/json;charset=utf-8' } };
  if (body !== undefined) opt.body = JSON.stringify(body);
  let json;
  try {
    const res = await fetch(path, opt);
    json = await res.json();
  } catch (e) {
    throw new Error('后端服务不可达,请确认服务已启动');
  }
  if (!json.success) throw new Error(json.message || '请求失败');
  return json.data;
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
const EMAIL_RE = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

function fmtDT(iso) { return iso ? String(iso).replace('T', ' ').slice(0, 19) : ''; }
function fmtHM(iso) { return iso ? String(iso).replace('T', ' ').slice(11, 16) : ''; }

function toast(msg, type) {
  const area = document.getElementById('toastArea');
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'success');
  const icon = type === 'error'
    ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
    : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
  el.innerHTML = icon + '<span>' + esc(msg) + '</span>';
  area.appendChild(el);
  setTimeout(() => { el.classList.add('fade-out'); setTimeout(() => el.remove(), 300); }, 2600);
}
function toastError(e) { toast(e && e.message ? e.message : String(e), 'error'); }

function openMask(id) { document.getElementById(id).classList.add('open'); }
function closeMask(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => closeMask(btn.getAttribute('data-close')));
});
document.querySelectorAll('.modal-mask').forEach(mask => {
  mask.addEventListener('mousedown', e => { if (e.target === mask) mask.classList.remove('open'); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal-mask.open').forEach(m => m.classList.remove('open'));
});

function statusBadge(status) {
  const map = {
    SUCCESS: ['badge-success', 'SUCCESS'],
    FAIL:    ['badge-fail', 'FAIL'],
    WAITING: ['badge-waiting', 'WAITING'],
    SENDING: ['badge-sending', 'SENDING']
  };
  const m = map[status] || ['badge-waiting', status];
  return '<span class="badge ' + m[0] + '">' + m[1] + '</span>';
}

/* ============================================================
 * 群配置主表格
 * ============================================================ */
let groups = [];

async function loadGroups() {
  const tbody = document.getElementById('configTbody');
  const empty = document.getElementById('configEmpty');
  tbody.innerHTML = '<tr><td colspan="6" class="loading-row">加载中……</td></tr>';
  empty.style.display = 'none';
  try {
    groups = await api('GET', '/api/declare-infos');
  } catch (e) {
    groups = [];
    tbody.innerHTML = '';
    empty.style.display = 'block';
    toastError(e);
    return;
  }
  document.getElementById('configCount').textContent = '共 ' + groups.length + ' 个';
  if (!groups.length) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  tbody.innerHTML = groups.map(c => {
    const tos = Object.entries(c.emails || {}).filter(([, t]) => t === 'TO').map(([a]) => a);
    const ccs = Object.entries(c.emails || {}).filter(([, t]) => t === 'CC').map(([a]) => a);
    let emailCell;
    if (!tos.length && !ccs.length) {
      emailCell = '<span class="email-empty">未配置，请点击「配置邮件」</span>';
    } else {
      emailCell = '<div class="email-tags">' +
        tos.map(e => '<span class="email-tag to" title="收件人 ' + esc(e) + '">TO ' + esc(e) + '</span>').join('') +
        ccs.map(e => '<span class="email-tag cc" title="抄送 ' + esc(e) + '">CC ' + esc(e) + '</span>').join('') +
        '</div>';
    }
    return '<tr>' +
      '<td class="cell-roomid">' + esc(c.roomId) + '</td>' +
      '<td>' + esc(c.groupName) + '</td>' +
      '<td>' + emailCell + '</td>' +
      '<td>' + esc(c.sendTime || '-') + '</td>' +
      '<td><span class="badge badge-success">启用中</span></td>' +
      '<td class="cell-actions">' +
        '<button class="btn-text" data-act="edit" data-id="' + c.id + '">修改</button>' +
        '<button class="btn-text" data-act="email" data-id="' + c.id + '">配置邮件</button>' +
        '<button class="btn-text" data-act="today" data-id="' + c.id + '">今日消息</button>' +
        '<button class="btn-text danger" data-act="del" data-id="' + c.id + '">删除</button>' +
      '</td>' +
    '</tr>';
  }).join('');
}

document.getElementById('configTbody').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const cfg = groups.find(c => c.id === Number(btn.getAttribute('data-id')));
  if (!cfg) return;
  const act = btn.getAttribute('data-act');
  if (act === 'edit') openEditModal(cfg);
  else if (act === 'email') openEmailModal(cfg);
  else if (act === 'today') openTodayModal(cfg);
  else if (act === 'del') openDeleteConfirm(cfg);
});

/* ============================================================
 * 新增群:下拉数据调后端 → 后端调其他组群列表 HTTP 接口(落库缓存)
 * ============================================================ */
async function openAddModal() {
  const sel = document.getElementById('groupRoomSelect');
  sel.innerHTML = '<option value="">加载中……</option>';
  document.getElementById('groupGroupName').value = '';
  document.getElementById('groupNameError').classList.remove('show');
  openMask('groupModalMask');
  let rooms;
  try {
    rooms = await api('GET', '/api/wechat-rooms');
  } catch (e) {
    sel.innerHTML = '<option value="">' + esc(e.message) + '</option>';
    toastError(e);
    return;
  }
  const available = rooms.filter(r => !r.configured);
  const srcLabel = (rooms.length && rooms[0].source === 'MOCK')
    ? '后端写死的 Mock 群列表（正式接口就绪后配置 url 自动切换）'
    : '其他开发组群列表 HTTP 接口';
  document.getElementById('groupRoomHint').textContent =
    '下拉数据来自：' + srcLabel + '（仅 roomId，已过滤配置过的群；群名称需人工确认填写）';
  if (!available.length) {
    sel.innerHTML = '<option value="">（暂无可选群：全部群均已配置）</option>';
    return;
  }
  sel.innerHTML = '<option value="">请选择微信群（roomId）</option>' + available.map(r =>
    '<option value="' + esc(r.roomId) + '">' + esc(r.roomId) + '</option>'
  ).join('');
};

document.getElementById('btnAdd').addEventListener('click', openAddModal);

document.getElementById('groupSaveBtn').addEventListener('click', async () => {
  const roomId = document.getElementById('groupRoomSelect').value;
  const groupName = document.getElementById('groupGroupName').value.trim();
  const errEl = document.getElementById('groupNameError');
  errEl.classList.remove('show');
  if (!roomId) { toast('请选择 roomId', 'error'); return; }
  if (!groupName) { errEl.textContent = '群名称不能为空（接口只提供 roomId，群名需人工确认）'; errEl.classList.add('show'); return; }
  if (groups.some(c => c.roomId === roomId)) { toast('roomId 已配置，不可重复', 'error'); return; }
  try {
    const saved = await api('POST', '/api/declare-infos', { roomId, groupName });
    await loadGroups();
    closeMask('groupModalMask');
    toast('新增成功：' + saved.groupName + '，请及时配置邮件');
  } catch (e) {
    toastError(e);
  }
});

/* ============================================================
 * 修改群（roomId 不可改）
 * ============================================================ */
let editingId = null;
function openEditModal(cfg) {
  editingId = cfg.id;
  document.getElementById('editRoomId').value = cfg.roomId;
  document.getElementById('editGroupName').value = cfg.groupName;
  document.getElementById('editGroupNameError').classList.remove('show');
  openMask('editModalMask');
}
document.getElementById('editSaveBtn').addEventListener('click', async () => {
  const name = document.getElementById('editGroupName').value.trim();
  const errEl = document.getElementById('editGroupNameError');
  errEl.classList.remove('show');
  if (!name) { errEl.textContent = '群名称不能为空'; errEl.classList.add('show'); return; }
  try {
    await api('PUT', '/api/declare-infos/' + editingId, { groupName: name });
    await loadGroups();
    closeMask('editModalMask');
    toast('修改成功');
  } catch (e) {
    toastError(e);
  }
});

/* ============================================================
 * 配置邮件（TO / CC 动态添加删除 + 发送时间）
 * ============================================================ */
let emailEditing = null, workTo = [], workCc = [];

function openEmailModal(cfg) {
  emailEditing = cfg.id;
  const entries = Object.entries(cfg.emails || {});
  workTo = entries.filter(([, t]) => t === 'TO').map(([a]) => a);
  workCc = entries.filter(([, t]) => t === 'CC').map(([a]) => a);
  document.getElementById('emailModalTip').textContent =
    '群：' + cfg.roomId + ' · ' + cfg.groupName + '（邮件模板固定，此处配置收发关系与发送时间）';
  document.getElementById('sendTimeInput').value = cfg.sendTime || '18:00';
  document.getElementById('toInput').value = '';
  document.getElementById('ccInput').value = '';
  document.getElementById('toInputError').classList.remove('show');
  document.getElementById('ccInputError').classList.remove('show');
  renderEmailList();
  openMask('emailModalMask');
}

function renderEmailList() {
  const render = (arr, containerId, type) => {
    const box = document.getElementById(containerId);
    if (!arr.length) {
      box.innerHTML = '<div class="email-empty-row">暂无' + (type === 'to' ? '收件人' : '抄送人') + '</div>';
      return;
    }
    box.innerHTML = arr.map((e, i) =>
      '<div class="email-item">' +
        '<span><span class="tag ' + type + '">' + type.toUpperCase() + '</span><span class="email-val">' + esc(e) + '</span></span>' +
        '<button class="email-remove" title="删除" data-type="' + type + '" data-idx="' + i + '">×</button>' +
      '</div>'
    ).join('');
  };
  render(workTo, 'toList', 'to');
  render(workCc, 'ccList', 'cc');
}

document.getElementById('toList').addEventListener('click', e => {
  const btn = e.target.closest('.email-remove');
  if (!btn) return;
  workTo.splice(Number(btn.getAttribute('data-idx')), 1);
  renderEmailList();
});
document.getElementById('ccList').addEventListener('click', e => {
  const btn = e.target.closest('.email-remove');
  if (!btn) return;
  workCc.splice(Number(btn.getAttribute('data-idx')), 1);
  renderEmailList();
});

function addEmail(inputId, errId, type) {
  const input = document.getElementById(inputId);
  const errEl = document.getElementById(errId);
  errEl.classList.remove('show');
  const val = input.value.trim();
  const list = type === 'to' ? workTo : workCc;
  if (!val) { errEl.textContent = '请输入邮箱地址'; errEl.classList.add('show'); return; }
  if (!EMAIL_RE.test(val)) { errEl.textContent = '邮箱格式不正确：' + val; errEl.classList.add('show'); return; }
  if (list.indexOf(val) !== -1) { errEl.textContent = '该邮箱已存在：' + val; errEl.classList.add('show'); return; }
  list.push(val);
  input.value = '';
  renderEmailList();
}
document.getElementById('toAddBtn').addEventListener('click', () => addEmail('toInput', 'toInputError', 'to'));
document.getElementById('ccAddBtn').addEventListener('click', () => addEmail('ccInput', 'ccInputError', 'cc'));
document.getElementById('toInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addEmail('toInput', 'toInputError', 'to'); } });
document.getElementById('ccInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addEmail('ccInput', 'ccInputError', 'cc'); } });

document.getElementById('emailSaveBtn').addEventListener('click', async () => {
  const time = document.getElementById('sendTimeInput').value;
  if (!workTo.length) { toast('请至少配置一个收件人（TO）', 'error'); return; }
  if (!time) { toast('请设置每日固定发送时间', 'error'); return; }
  try {
    await api('PUT', '/api/declare-infos/' + emailEditing + '/emails',
      { sendTime: time, to: workTo.slice(), cc: workCc.slice() });
    await loadGroups();
    closeMask('emailModalMask');
    toast('邮件配置已保存，每日 ' + time + ' 发送');
  } catch (e) {
    toastError(e);
  }
});

/* ============================================================
 * 今日消息
 * ============================================================ */
async function openTodayModal(cfg) {
  const body = document.getElementById('msgModalBody');
  document.getElementById('msgModalTitle').textContent =
    '今日消息 · ' + cfg.groupName + '（' + cfg.roomId + '）';
  body.innerHTML = '<div class="loading-row">加载中……</div>';
  openMask('msgModalMask');
  let list;
  try {
    list = await api('GET', '/api/declare-infos/' + cfg.id + '/messages/today');
  } catch (e) {
    body.innerHTML = '<div class="empty-state"><div class="empty-title">加载失败</div><div class="empty-desc">' + esc(e.message) + '</div></div>';
    return;
  }
  if (!list.length) {
    body.innerHTML =
      '<div class="empty-state">' +
        '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
        '<div class="empty-title">今日暂无消息</div>' +
        '<div class="empty-desc">该群今天没有收到符合条件的消息（msgtype=text 且 roomid 非空）</div>' +
      '</div>';
    return;
  }
  body.innerHTML =
    '<div class="form-hint" style="margin-bottom:8px">共 ' + list.length + ' 条 · 到达发送时间 ' + esc(cfg.sendTime || '未设置') + ' 后将汇总为一封邮件发送</div>' +
    list.map(m =>
      '<div class="msg-item">' +
        '<div class="msg-avatar">' + esc((m.fromUser || '?').charAt(0)) + '</div>' +
        '<div style="flex:1">' +
          '<div class="msg-meta"><span class="msg-from">' + esc(m.fromUser) + '</span><span class="msg-time">' + esc(fmtDT(m.msgTime)) + '</span></div>' +
          '<div class="msg-content">' + esc(m.content) + '</div>' +
        '</div>' +
      '</div>'
    ).join('');
}

/* ============================================================
 * 删除（二次确认）
 * ============================================================ */
let deletingId = null;
function openDeleteConfirm(cfg) {
  deletingId = cfg.id;
  document.getElementById('confirmText').innerHTML =
    '确认删除群配置 <span class="strong">' + esc(cfg.groupName) + '（' + esc(cfg.roomId) + '）</span> 吗？<br>' +
    '<span style="color:var(--text-sub);font-size:13px">删除后该群将不再汇总发送邮件，历史发送记录保留。</span>';
  openMask('confirmModalMask');
}
document.getElementById('confirmOkBtn').addEventListener('click', async () => {
  try {
    await api('DELETE', '/api/declare-infos/' + deletingId);
    await loadGroups();
    closeMask('confirmModalMask');
    toast('删除成功');
  } catch (e) {
    toastError(e);
  }
});

/* ============================================================
 * 发送记录 & 发送详情
 * ============================================================ */
document.getElementById('btnRecords').addEventListener('click', openRecordsModal);

async function openRecordsModal() {
  const tbody = document.getElementById('recordsTbody');
  tbody.innerHTML = '<tr><td colspan="6" class="loading-row">加载中……</td></tr>';
  openMask('recordsModalMask');
  let records;
  try {
    records = await api('GET', '/api/send-records?limit=50');
  } catch (e) {
    tbody.innerHTML = '';
    toastError(e);
    return;
  }
  if (!records.length) {
    tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><div class="empty-title">暂无发送记录</div><div class="empty-desc">到达各群配置的发送时间后，这里会出现汇总邮件的发送记录</div></div></td></tr>';
    return;
  }
  tbody.innerHTML = records.map(r => {
    const tos = (r.toAddresses || '').split(';').filter(Boolean);
    const ccs = (r.ccAddresses || '').split(';').filter(Boolean);
    return '<tr>' +
      '<td class="cell-roomid" style="font-size:12px">' + esc(fmtDT(r.sendTime || r.createTime)) +
        (r.roundNo > 1 ? '（第' + r.roundNo + '轮）' : '') + '</td>' +
      '<td>' + esc(r.groupName) + '</td>' +
      '<td>' + r.messageCount + '</td>' +
      '<td><div class="email-tags" style="max-width:240px">' +
        tos.map(e => '<span class="email-tag to" title="' + esc(e) + '">' + esc(e) + '</span>').join('') +
        ccs.map(e => '<span class="email-tag cc" title="抄送 ' + esc(e) + '">' + esc(e) + '</span>').join('') +
      '</div></td>' +
      '<td>' + statusBadge(r.sendStatus) +
        (r.sendStatus === 'FAIL' && r.errorMessage ? '<div class="fail-reason" title="' + esc(r.errorMessage) + '">失败原因：' + esc(r.errorMessage) + '</div>' : '') +
      '</td>' +
      '<td class="cell-actions"><button class="btn-text" data-record="' + r.id + '">查看详情</button></td>' +
    '</tr>';
  }).join('');
}

document.getElementById('recordsTbody').addEventListener('click', e => {
  const btn = e.target.closest('button[data-record]');
  if (!btn) return;
  openRecordDetail(Number(btn.getAttribute('data-record')));
});

async function openRecordDetail(id) {
  const body = document.getElementById('detailModalBody');
  body.innerHTML = '<div class="loading-row">加载中……</div>';
  openMask('detailModalMask');
  let r;
  try {
    r = await api('GET', '/api/send-records/' + id);
  } catch (e) {
    body.innerHTML = '<div class="empty-state"><div class="empty-title">加载失败</div><div class="empty-desc">' + esc(e.message) + '</div></div>';
    return;
  }
  let html =
    '<div class="detail-grid">' +
      '<div class="detail-label">发送时间</div><div class="detail-value">' + esc(fmtDT(r.sendTime || r.createTime)) +
        '（第 ' + (r.roundNo || 1) + ' 轮）</div>' +
      '<div class="detail-label">群名称</div><div class="detail-value">' + esc(r.groupName) + '（' + esc(r.roomId) + '）</div>' +
      '<div class="detail-label">收件人</div><div class="detail-value">' + esc((r.toAddresses || '').split(';').join('；')) + '</div>' +
      '<div class="detail-label">抄送</div><div class="detail-value">' + esc(r.ccAddresses ? r.ccAddresses.split(';').join('；') : '无') + '</div>' +
      '<div class="detail-label">发送状态</div><div class="detail-value">' + statusBadge(r.sendStatus) + '</div>' +
    '</div>';
  if (r.sendStatus === 'FAIL' && r.errorMessage) {
    html += '<div class="error-callout"><strong>失败原因：</strong>' + esc(r.errorMessage) + '</div>';
  }
  html += '<div class="section-title">本次邮件包含的微信群消息（' + r.messages.length + ' 条）</div>';
  html += r.messages.map(m =>
    '<div class="msg-item">' +
      '<div class="msg-avatar">' + esc((m.fromUser || '?').charAt(0)) + '</div>' +
      '<div style="flex:1">' +
        '<div class="msg-meta"><span class="msg-from">' + esc(m.fromUser) + '</span><span class="msg-time">' + esc(fmtDT(m.msgTime)) + '</span></div>' +
        '<div class="msg-content">' + esc(m.content) + '</div>' +
      '</div>' +
    '</div>'
  ).join('');
  body.innerHTML = html;
}

/* ============================================================
 * 初始化
 * ============================================================ */
document.getElementById('todayLabel').textContent = '今天：' + new Date().toLocaleDateString('zh-CN');
loadGroups();
</script>
</body>
</html>
