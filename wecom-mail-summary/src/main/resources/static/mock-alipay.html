<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>支付宝沙箱收银台（本地模拟）</title>
  <style>
    body { max-width: 600px; margin: 48px auto; padding: 0 20px; color: #202124; font: 16px/1.6 system-ui, sans-serif; }
    header { padding-bottom: 16px; border-bottom: 1px solid #ddd; }
    h1 { font-size: 24px; }
    button { padding: 10px 16px; border: 0; border-radius: 4px; background: #1677ff; color: white; cursor: pointer; }
    pre { background: #f4f6f8; padding: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header><strong>支付宝沙箱收银台</strong><br>本地渠道模拟，不会发起真实扣款</header>
  <h1>确认支付</h1>
  <p>订单号：<code id="orderNo"></code></p>
  <p>商品：邮件汇总服务 30 天</p>
  <p>金额：<strong>¥ 19.90</strong></p>
  <button id="pay">确认支付（模拟成功）</button>
  <p id="message" role="status"></p>
  <pre id="details"></pre>
  <script>
    const orderNo = new URLSearchParams(location.search).get('orderNo');
    document.querySelector('#orderNo').textContent = orderNo || '缺少订单号';
    const button = document.querySelector('#pay');
    button.addEventListener('click', async () => {
      button.disabled = true;
      try {
        const response = await fetch(`/mock/alipay/trades/${orderNo}/pay`, { method: 'POST' });
        const trade = await response.json();
        if (!response.ok) throw new Error(trade.message || '支付失败');
        document.querySelector('#details').textContent = JSON.stringify(trade, null, 2);
        document.querySelector('#message').textContent = '支付宝渠道已收款。商户订单稍后由异步通知更新，也可以点下方返回主动查单。';
        button.textContent = '渠道已支付';
        setTimeout(() => { location.href = `/payment-demo.html?orderNo=${encodeURIComponent(orderNo)}`; }, 1200);
      } catch (error) {
        document.querySelector('#message').textContent = error.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
